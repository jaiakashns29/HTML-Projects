<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen AI Assistant | Mini Project</title>
    <style>
        /* --- CSS STYLING --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f1f5f9;
        }

        .chat-container {
            width: 95%;
            max-width: 500px;
            height: 85vh;
            background: #1e293b;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }

        header {
            padding: 20px;
            background: #334155;
            text-align: center;
            border-bottom: 1px solid #475569;
        }

        header h1 { font-size: 1.5rem; color: #3b82f6; }
        header p { font-size: 0.8rem; opacity: 0.8; }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: #475569 #1e293b;
        }

        /* Message Bubbles */
        .message {
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background: #475569;
            color: #f1f5f9;
            border-bottom-left-radius: 2px;
        }

        /* Typing Indicator */
        .typing {
            font-style: italic;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 10px;
            display: none;
        }

        .input-area {
            padding: 15px;
            background: #334155;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            outline: none;
            background: #0f172a;
            color: white;
            transition: border 0.3s;
        }

        input:focus { border-color: #3b82f6; }

        button {
            padding: 10px 18px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #2563eb; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <h1>NexGen AI</h1>
            <p>Status: <span style="color: #4ade80;">Active</span></p>
        </header>

        <div id="chat-box" class="chat-box">
            <div class="message ai-message">Hi! I'm your project assistant. Ask me anything!</div>
        </div>

        <div id="typing-indicator" class="typing" style="padding-left: 20px;">AI is thinking...</div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask a question..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');

        // Function to create message elements
        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role === 'user' ? 'user-message' : 'ai-message');
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            
            // Auto-scroll to the latest message
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Simple Local AI Logic
        function generateResponse(input) {
            const query = input.toLowerCase();
            
            if (query.includes("help")) return "I can help with code, general knowledge, or just chatting!";
            if (query.includes("who are you")) return "I am a simple AI assistant built with HTML, CSS, and JS.";
            if (query.includes("javascript")) return "JavaScript is a versatile language that powers the web!";
            if (query.includes("name")) return "You can call me NexGen.";
            if (query.includes("date") || query.includes("time")) return "Today is " + new Date().toDateString();
            
            return "That's a great question! I'm a simple demo, so I don't have all the answers yet, but I'm learning.";
        }

        function processChat() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Show User Message
            appendMessage('user', text);
            userInput.value = "";

            // 2. Show Typing Indicator
            typingIndicator.style.display = "block";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Simulate AI delay (600ms to 1.5s)
            setTimeout(() => {
                typingIndicator.style.display = "none";
                const aiResponse = generateResponse(text);
                appendMessage('ai', aiResponse);
            }, 800);
        }

        // Event Listeners
        sendBtn.addEventListener('click', processChat);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processChat();
        });
    </script>
</body>
</html>
