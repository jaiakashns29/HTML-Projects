<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone - Search & Play</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;700&display=swap');

        :root {
            --bg-black: #000000;
            --bg-dark: #121212;
            --bg-grey: #242424;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --spotify-green: #1ed760;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Figtree', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-main);
            height: 100vh;
            display: grid;
            grid-template-areas: 
                "sidebar main"
                "footer footer";
            grid-template-columns: 260px 1fr;
            grid-template-rows: 1fr 90px;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            grid-area: sidebar;
            background-color: var(--bg-black);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo { font-size: 1.6rem; font-weight: 800; color: white; display: flex; align-items: center; gap: 10px; margin-bottom: 10px;}
        
        .search-container {
            position: relative;
            margin-bottom: 10px;
        }

        .search-container input {
            width: 100%;
            background: var(--bg-grey);
            border: 1px solid transparent;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .search-container input:focus {
            border-color: #555;
            background: #2a2a2a;
        }

        .nav-item { color: var(--text-dim); text-decoration: none; font-weight: 700; transition: 0.3s; cursor: pointer; }
        .nav-item:hover { color: white; }

        /* MAIN VIEW */
        .main-view {
            grid-area: main;
            background: linear-gradient(to bottom, #222, var(--bg-dark));
            margin: 8px 8px 0 0;
            border-radius: 8px;
            overflow-y: auto;
            padding: 30px;
        }

        .header-box { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 30px; }
        .header-box img { width: 232px; height: 232px; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
        .header-box h1 { font-size: 4.5rem; font-weight: 900; letter-spacing: -2px; }

        .song-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .song-table th { text-align: left; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px; }
        
        .song-row { cursor: pointer; transition: 0.2s; border-radius: 4px; }
        .song-row:hover { background: rgba(255,255,255,0.1); }
        .song-row td { padding: 12px 10px; font-size: 0.9rem; vertical-align: middle; }
        .song-row img { width: 40px; height: 40px; border-radius: 4px; margin-right: 15px; }
        .song-row.active { color: var(--spotify-green); }

        .hidden { display: none; }

        /* FOOTER PLAYER */
        .player-bar {
            grid-area: footer;
            background-color: var(--bg-black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .track-info { display: flex; align-items: center; width: 30%; gap: 15px; }
        .track-info img { width: 56px; height: 56px; border-radius: 4px; background: #333; }
        .track-text h4 { font-size: 0.9rem; margin-bottom: 4px; }
        .track-text p { font-size: 0.75rem; color: var(--text-dim); }

        .player-controls { width: 40%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .control-btns { display: flex; align-items: center; gap: 24px; }
        .play-btn { width: 32px; height: 32px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; border: none; cursor: pointer; transition: 0.2s; }
        .play-btn:hover { transform: scale(1.06); }

        .progress-wrapper { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: var(--text-dim); }
        .progress-bg { flex: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background: white; width: 0%; border-radius: 2px; }
        .progress-bg:hover .progress-fill { background: var(--spotify-green); }

        .volume-box { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        input[type="range"] { accent-color: var(--spotify-green); cursor: pointer; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo"><span>🎧</span> Spotify Clone</div>
        <div class="search-container">
            <input type="text" id="songSearch" placeholder="Search by song or artist...">
        </div>
        <nav style="display: flex; flex-direction: column; gap: 15px;">
            <div class="nav-item">🏠 Home</div>
            <div class="nav-item">🚀 Browse</div>
            <div class="nav-item">📚 Your Library</div>
        </nav>
    </aside>

    <main class="main-view">
        <div class="header-box">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=400" id="hero-img">
            <div>
                <p style="font-size: 0.75rem; font-weight: 700; margin-bottom: 8px;">PLAYLIST</p>
                <h1 id="hero-title">Global Top Tracks</h1>
            </div>
        </div>

        <table class="song-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Play</th>
                </tr>
            </thead>
            <tbody id="playlist-body">
                </tbody>
        </table>
    </main>

    <footer class="player-bar">
        <div class="track-info">
            <img src="" id="footer-img">
            <div class="track-text">
                <h4 id="footer-title">No track selected</h4>
                <p id="footer-artist">Artist</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <button onclick="skipSong(-1)" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">⏮</button>
                <button class="play-btn" id="master-play" onclick="togglePlay()">▶</button>
                <button onclick="skipSong(1)" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">⏭</button>
            </div>
            <div class="progress-wrapper">
                <span id="current-time">0:00</span>
                <div class="progress-bg" id="seek-container">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>
                <span id="duration-time">0:00</span>
            </div>
        </div>

        <div class="volume-box">
            <span>🔈</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
        </div>
    </footer>

    <audio id="audio-engine"></audio>

    <script>
        const audio = document.getElementById('audio-engine');
        const playBtn = document.getElementById('master-play');
        const progressBar = document.getElementById('progress-bar');
        const seekContainer = document.getElementById('seek-container');
        const searchInput = document.getElementById('songSearch');
        const playlistBody = document.getElementById('playlist-body');

        // Extended Song Library
        const songs = [
            { id: 0, title: "Midnight City", artist: "M83 Collective", img: "https://picsum.photos/id/10/400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { id: 1, title: "Cyber Dreams", artist: "Synth Dev", img: "https://picsum.photos/id/20/400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { id: 2, title: "Ocean Breeze", artist: "Chill Flow", img: "https://picsum.photos/id/30/400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            { id: 3, title: "Neon Nights", artist: "Retro Runner", img: "https://picsum.photos/id/40/400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" },
            { id: 4, title: "Lofi Study", artist: "Focus Beats", img: "https://picsum.photos/id/50/400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3" },
            { id: 5, title: "Deep Bass", artist: "Sub Woofer", img: "https://picsum.photos/id/60/400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-13.mp3" },
            { id: 6, title: "Summer Rain", artist: "Nature Sound", img: "https://picsum.photos/id/70/400", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" }
        ];

        let currentIdx = 0;

        // Initialize Table
        function renderSongs(filter = "") {
            playlistBody.innerHTML = "";
            songs.forEach((song, index) => {
                if (song.title.toLowerCase().includes(filter) || song.artist.toLowerCase().includes(filter)) {
                    const row = document.createElement('tr');
                    row.className = `song-row ${index === currentIdx ? 'active' : ''}`;
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td style="display:flex; align-items:center;"><img src="${song.img}"> ${song.title}</td>
                        <td>${song.artist}</td>
                        <td><button onclick="playTarget(${index})" style="background:var(--spotify-green); border:none; padding:6px 12px; border-radius:20px; color:black; font-weight:bold; cursor:pointer;">PLAY</button></td>
                    `;
                    playlistBody.appendChild(row);
                }
            });
        }

        // Search Logic
        searchInput.addEventListener('input', (e) => {
            renderSongs(e.target.value.toLowerCase());
        });

        // Playback Logic
        function loadSong(index) {
            currentIdx = index;
            const song = songs[index];
            document.getElementById('footer-title').innerText = song.title;
            document.getElementById('footer-artist').innerText = song.artist;
            document.getElementById('footer-img').src = song.img;
            document.getElementById('hero-img').src = song.img;
            document.getElementById('hero-title').innerText = song.title;
            audio.src = song.url;
            renderSongs(searchInput.value.toLowerCase()); // Refresh UI highlights
        }

        function playTarget(index) {
            loadSong(index);
            audio.play();
            playBtn.innerText = '⏸';
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸';
            } else {
                audio.pause();
                playBtn.innerText = '▶';
            }
        }

        function skipSong(dir) {
            currentIdx = (currentIdx + dir + songs.length) % songs.length;
            playTarget(currentIdx);
        }

        // Progress Bar Update
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
                
                // Format Time
                const curM = Math.floor(audio.currentTime / 60);
                const curS = Math.floor(audio.currentTime % 60);
                const durM = Math.floor(audio.duration / 60);
                const durS = Math.floor(audio.duration % 60);
                document.getElementById('current-time').innerText = `${curM}:${curS < 10 ? '0' : ''}${curS}`;
                document.getElementById('duration-time').innerText = `${durM}:${durS < 10 ? '0' : ''}${durS}`;
            }
        });

        // Seek Click
        seekContainer.addEventListener('click', (e) => {
            const width = seekContainer.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        // Volume
        document.getElementById('volume-slider').addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Auto-next
        audio.addEventListener('ended', () => skipSong(1));

        // Start
        renderSongs();
        loadSong(0);
    </script>
</body>
</html>
